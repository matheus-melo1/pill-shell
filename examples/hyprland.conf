# Exemplo de integração da pill com o Hyprland.
# Copie para ~/.config/hypr/ e inclua no seu hyprland.conf:
#   source = ~/.config/hypr/pill.conf
# Ajuste os atalhos que conflitarem com os seus.

# Inicia a pill no login (-d = daemon, desacoplado do terminal)
exec-once = qs -c pill -d

# Cada surface recebe o monitor focado, para abrir na tela certa.
$pillMon = "$(hyprctl activeworkspace -j | jq -r .monitor)"

# --- Surfaces da pill (abrem a partir da pílula no topo) ---------------------
bind = SUPER CTRL, RETURN, exec, qs -c pill ipc call pill launcher  $pillMon  # Launcher de apps
bind = SUPER, V,           exec, qs -c pill ipc call pill clipboard $pillMon  # Histórico do clipboard
bind = SUPER, C,           exec, qs -c pill ipc call pill wallpaper $pillMon  # Seletor de wallpaper
bind = SUPER, N,           exec, qs -c pill ipc call pill calendar  $pillMon  # Calendário
bind = SUPER, M,           exec, qs -c pill ipc call pill mixer     $pillMon  # Áudio / brilho
bind = SUPER, slash,       exec, qs -c pill ipc call pill link      $pillMon  # Wi-Fi / Bluetooth
bind = SUPER, P,           exec, qs -c pill ipc call pill power     $pillMon  # Menu de energia
bind = SUPER CTRL, C,      exec, qs -c pill ipc call pill claude    $pillMon  # Sessões / uso do Claude Code
bind = SUPER CTRL, D,      exec, qs -c pill ipc call pill todo      $pillMon  # Nova tarefa rápida

# --- Drawer lateral (desliza pela direita) ----------------------------------
bind = SUPER CTRL, G,       exec, qs -c pill ipc call pill github  $pillMon  # GitHub
bind = SUPER CTRL, V,       exec, qs -c pill ipc call pill vpn     $pillMon  # VPN
bind = SUPER CTRL, N,       exec, qs -c pill ipc call pill notifs  $pillMon  # Histórico de notificações
bind = SUPER CTRL, A,       exec, qs -c pill ipc call pill ai      $pillMon  # Chat com IA
bind = SUPER CTRL SHIFT, D, exec, qs -c pill ipc call pill todos   $pillMon  # Lista de tarefas
bind = SUPER CTRL, F,       exec, qs -c pill ipc call pill storage $pillMon  # Armazenamento
